<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>HQ</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff; --fg: #000000; --mute: #6b6b6b; --line: #e6e6e6; --link: #0000EE;
  --bar: #000000; --bar2: #b8b8b8; --ok: #0a7d32; --warn: #c0392b; --due: #b35c00;
  --font: "JetBrains Mono", ui-monospace, monospace; --size: 17px;
}
[data-theme="dark"] {
  --bg: #000000; --fg: #ffffff; --mute: #8a8a8a; --line: #222222; --link: #58a6ff;
  --bar: #ffffff; --bar2: #555555; --ok: #3ddc84; --warn: #ff6b5b; --due: #ffb04a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: var(--size);
  line-height: 1.45; letter-spacing: -0.02em; text-transform: uppercase; -webkit-font-smoothing: antialiased;
  padding: 64px 24px 48px; }
main, footer { max-width: 980px; margin: 0 auto; }
a { color: var(--link); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { opacity: .7; }
button { font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; background: none; border: 0; }
.ul { text-decoration: underline; text-underline-offset: 3px; }
.mute { color: var(--mute); }
.ok { color: var(--ok); } .warn { color: var(--warn); } .due { color: var(--due); }
h1 { font-size: var(--size); font-weight: 700; }
h2 { font-size: var(--size); font-weight: 500; text-decoration: underline; text-underline-offset: 4px; margin: 48px 0 16px; }
.num { font-variant-numeric: tabular-nums; }

/* lock */
#lock { min-height: 70vh; display: flex; flex-direction: column; justify-content: center; gap: 14px; max-width: 760px; margin: 0 auto; }
#lock form { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
#lock input { font: inherit; color: var(--fg); background: transparent; border: 0; border-bottom: 1px solid var(--fg);
  padding: 6px 0; width: min(320px, 100%); outline: none; letter-spacing: .05em; }
.btn { background: var(--fg); color: var(--bg); padding: 8px 16px; font-weight: 700; }
#err { color: var(--warn); min-height: 1.3em; }

/* header */
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 24px; flex-wrap: wrap; }
.monthnav { display: flex; gap: 14px; align-items: baseline; }
.monthnav button:disabled { opacity: .25; cursor: default; }

/* big numbers */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--fg); border-bottom: 1px solid var(--line); margin-top: 24px; }
.stat { padding: 16px 16px 18px 0; }
.stat + .stat { padding-left: 16px; border-left: 1px solid var(--line); }
.stat .v { font-size: 34px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.1; margin-top: 6px; }
.stat .s { font-size: 13px; margin-top: 6px; }

/* rows */
.rows { list-style: none; }
.rows li { display: grid; grid-template-columns: 120px 1fr auto; column-gap: 16px; padding: 9px 0; border-top: 1px solid var(--line); align-items: baseline; }
.rows li:last-child { border-bottom: 1px solid var(--line); }
.rows .r { text-align: right; white-space: nowrap; }
.rows.two li { grid-template-columns: minmax(0, 1fr) auto; }
.small { font-size: 13px; }
details summary { list-style: none; cursor: pointer; }
details summary::-webkit-details-marker { display: none; }
details summary h2::after { content: " +"; }
details[open] summary h2::after { content: " −"; }
.rows li > span { min-width: 0; overflow-wrap: anywhere; }
td { overflow-wrap: anywhere; }
.sub { display: block; font-size: 13px; color: var(--mute); }

/* clients table */
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 12px 9px 0; border-top: 1px solid var(--line); vertical-align: baseline; }
th { font-weight: 500; color: var(--mute); font-size: 13px; border-top: 0; }
td.n, th.n { text-align: right; padding-right: 0; padding-left: 12px; white-space: nowrap; }
tr:last-child td { border-bottom: 1px solid var(--line); }
.tag { display: inline-block; font-size: 12px; border: 1px solid currentColor; padding: 0 5px; margin-left: 6px; vertical-align: 2px; }

/* bars */
.bars { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 12px; align-items: end; height: 220px; border-bottom: 1px solid var(--fg); }
.bar { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; cursor: pointer; }
.bar .t { font-size: 12px; display: flex; justify-content: center; margin-bottom: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar:first-child .t { justify-content: flex-start; } .bar:last-child .t { justify-content: flex-end; }
.bar .seg { width: 100%; }
.bar .paid { background: var(--bar); }
.bar .unpaid { background: var(--bar2); }
.bar .todo { background: repeating-linear-gradient(135deg, var(--bar2) 0 2px, transparent 2px 7px); border: 1px solid var(--bar2); border-bottom: 0; }
.bar.sel .t { font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.barlabels { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 12px; margin-top: 8px; font-size: 13px; text-align: center; color: var(--mute); }
.barlabels .sel { color: var(--fg); font-weight: 700; }
.barlabels .sm { display: none; }
.barlabels .yr { display: block; font-size: 10px; color: var(--mute); font-weight: 400; }
.bars { gap: 6px; } .barlabels { gap: 6px; }
.chartbar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: -4px 0 18px; font-size: 13px; }
.seg-ctl { display: flex; border: 1px solid var(--fg); }
.seg-ctl button { padding: 5px 10px; color: var(--mute); }
.seg-ctl button + button { border-left: 1px solid var(--fg); }
.seg-ctl button.on { background: var(--fg); color: var(--bg); }
.linechart { position: relative; height: 220px; border-bottom: 1px solid var(--fg); }
.linechart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.linechart .dot { position: absolute; width: 10px; height: 10px; margin: 0 0 -5px -5px; border-radius: 50%; background: var(--fg); border: 2px solid var(--bg); box-shadow: 0 0 0 1px var(--fg); }
.linechart .tip { position: absolute; transform: translateX(-50%); font-size: 12px; font-weight: 700; background: var(--bg); padding: 1px 4px; border: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
.linechart .tip.l { transform: none; } .linechart .tip.r { transform: translateX(-100%); }
.linechart .vline { position: absolute; top: 0; bottom: 0; width: 1px; margin-left: -.5px; background: var(--line); }
.linechart { touch-action: pan-y; cursor: crosshair; user-select: none; -webkit-user-select: none; }
.linechart .hit { position: absolute; inset: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
.linechart .hit .bar { height: 100%; }
.legend { display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px; color: var(--mute); margin-top: 14px; }
.legend i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; }

/* meter */
.meter { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 3px; margin: 12px 0 8px; }
.meter span { height: 18px; background: var(--line); }
.meter span.on { background: var(--bar); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 40px; }

footer { margin-top: 48px; display: flex; justify-content: space-between; gap: 16px; }
body.locked footer { max-width: 760px; }
.copy { color: var(--mute); }

@media (max-width: 760px) {
  :root { --size: 14px; }
  body { padding: 32px 16px; }
  .stats { grid-template-columns: 1fr 1fr; }
  .stat:nth-child(3) { padding-left: 0; border-left: 0; }
  .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
  .stat .v { font-size: 26px; }
  .cols { grid-template-columns: 1fr; }
  .rows li { grid-template-columns: minmax(0, 1fr) auto; }
  .rows.two li > :first-child { grid-column: auto; font-size: inherit; }
  .sub { font-size: 12px; }
  .legend span[style*="margin-left"] { margin-left: 0 !important; }
  .rows li > :first-child { grid-column: 1 / -1; font-size: 12px; }
  .hide-sm { display: none; }
  .bars { height: 160px; gap: 3px; } .barlabels { gap: 3px; font-size: 11px; }
  .barlabels.dense .lg { display: none; } .barlabels.dense .sm { display: inline; }
  .barlabels { font-size: 10px; } .linechart { height: 160px; }
  .bars { overflow-x: clip; } .bar .t { visibility: hidden; } .bar.sel .t { visibility: visible; white-space: nowrap; }
  .bar .t { font-size: 10px; }
}
</style>
</head>
<body class="locked">
<main>
  <div id="lock">
    <h1>HQ</h1>
    <p class="mute">PRIVATE. ENTER PASSWORD.</p>
    <form id="f" autocomplete="on">
      <input type="text" name="username" value="hq" autocomplete="username" hidden>
      <input id="pw" type="password" autocomplete="current-password" placeholder="PASSWORD" aria-label="Password" required>
      <button class="btn" type="submit">ENTER</button>
    </form>
    <p id="err" role="alert"></p>
  </div>
  <div id="app" hidden></div>
</main>
<footer>
  <button id="theme" class="ul" type="button">[DARK MODE]</button>
  <span><button id="logout" class="ul" type="button" hidden>[LOCK]</button></span>
</footer>

<script>
(() => {
  const KEY = "hq.key.v1";
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const setTheme = t => { document.documentElement.dataset.theme = t; $("#theme").textContent = t === "dark" ? "[LIGHT MODE]" : "[DARK MODE]"; };
  setTheme("light");
  $("#theme").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

  /* crypto: same scheme as /vincere (PBKDF2-SHA256 -> AES-256-GCM); the derived key is remembered on this device */
  let blob;
  const derive = async (pw, b) => {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(b.salt), iterations: b.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  };
  const decrypt = async (key, b) => JSON.parse(new TextDecoder().decode(
    await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(b.iv) }, key, b64(b.ct))));
  const tryStored = async () => {
    const raw = store.get(KEY); if (!raw) return null;
    try {
      const s = JSON.parse(raw); if (s.salt !== blob.salt) return null;
      return await decrypt(await crypto.subtle.importKey("raw", b64(s.k), "AES-GCM", false, ["decrypt"]), blob);
    } catch { return null; }
  };
  $("#f").onsubmit = async e => {
    e.preventDefault(); $("#err").textContent = "CHECKING…";
    try {
      const key = await derive($("#pw").value.trim(), blob);
      const data = await decrypt(key, blob);
      store.set(KEY, JSON.stringify({ salt: blob.salt, k: toB64(await crypto.subtle.exportKey("raw", key)) }));
      $("#err").textContent = ""; start(data);
    } catch { $("#err").textContent = "WRONG PASSWORD."; }
  };
  $("#logout").onclick = () => { store.del(KEY); location.reload(); };

  /* helpers */
  const MON = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  const ym = iso => iso.slice(0, 7);
  const monthName = m => { const [y, mm] = m.split("-").map(Number); return `${MON[mm-1]} ${y}`; };
  const dShort = iso => { if (!iso) return "—"; const [, m, d] = iso.split("-").map(Number); return `${d} ${MON[m-1]}`; };
  const money = n => "$" + Math.round(n).toLocaleString("en-US");
  const todayIso = () => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`; };
  const days = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
  const addMonth = (m, k) => { let [y, mm] = m.split("-").map(Number); mm += k; while (mm > 12) { mm -= 12; y++; } while (mm < 1) { mm += 12; y--; } return `${y}-${String(mm).padStart(2,"0")}`; };

  let D, sel;
  // chart prefs (this device only): range = "YYYY" | "ALL", view = "bars" | "line"
  const pref = (() => { try { return JSON.parse(localStorage.getItem("hq.chart") || "{}"); } catch { return {}; } })();
  let range = null, view = pref.view === "line" ? "line" : "bars";
  const savePref = () => { try { localStorage.setItem("hq.chart", JSON.stringify({ view })); } catch {} };
  function start(data) {
    D = data;
    document.body.classList.remove("locked"); $("#lock").hidden = true; $("#app").hidden = false; $("#logout").hidden = false;
    sel = ym(todayIso());
    render();
  }

  function model() {
    const name = k => (D.clients.find(c => c.key === k) || {}).name || k.replace(/^other:/, "");
    const inv = D.invoices.map(i => ({ ...i, open: Math.max(0, i.amount - i.paid) }));
    const todo = D.work.filter(w => !w.invoiced && w.amount > 0);
    const months = new Set([...inv.map(i => ym(i.sale)), ...todo.map(w => w.month), ym(todayIso())]);
    const sorted = [...months].sort();
    const all = []; for (let m = sorted[0]; m <= sorted[sorted.length - 1]; m = addMonth(m, 1)) all.push(m);
    const per = m => {
      const mi = inv.filter(i => ym(i.sale) === m), mt = todo.filter(w => w.month === m);
      const paid = mi.reduce((s, i) => s + i.paid, 0), unpaid = mi.reduce((s, i) => s + i.open, 0);
      const notInv = mt.reduce((s, w) => s + w.amount, 0);
      return { m, inv: mi, todo: mt, paid, unpaid, notInv, made: paid + unpaid + notInv };
    };
    return { name, inv, todo, all, per };
  }

  function render() {
    const M = model(), t = todayIso(), cur = M.per(sel), prev = M.per(addMonth(sel, -1));
    const owed = M.inv.filter(i => i.open > 0), toInvoice = M.todo;
    // one invoice per client per month (e.g. Decoded: all episodes of the month on one invoice)
    const invGroups = Object.values(toInvoice.reduce((acc, w) => {
      const k = w.client + "|" + w.month;
      (acc[k] ||= { client: w.client, month: w.month, items: [], total: 0 }).items.push(w);
      acc[k].total += w.amount; return acc;
    }, {})).sort((a, b) => a.month.localeCompare(b.month) || b.total - a.total);
    const owedSum = owed.reduce((s, i) => s + i.open, 0), toInvSum = toInvoice.reduce((s, w) => s + w.amount, 0);
    const total = M.all.reduce((s, m) => s + M.per(m).made, 0);
    const withData = M.all.filter(m => M.per(m).made > 0).length;
    const years = [...new Set(M.all.map(m => m.slice(0, 4)))].map(y => ({ y, sum: M.all.filter(m => m.startsWith(y)).reduce((a, m) => a + M.per(m).made, 0) }));
    const delta = prev.made ? Math.round((cur.made - prev.made) / prev.made * 100) : null;
    const thisYear = t.slice(0, 4), yearsAll = [...new Set(M.all.map(m => m.slice(0, 4)))];
    if (!range) range = thisYear;
    const cm = range === "ALL" ? M.all
      : Array.from({ length: range === thisYear ? Number(t.slice(5, 7)) : 12 }, (_, i) => `${range}-${String(i + 1).padStart(2, "0")}`);
    const cv = cm.map(m => M.per(m).made);
    const maxBar = Math.max(...cv, 1);
    const rTotal = cv.reduce((a, b) => a + b, 0);
    const firstData = cm.findIndex((m, i) => cv[i] > 0);
    const rMonths = firstData < 0 ? 1 : cm.length - firstData;          // months since work started in this range
    const bestI = cv.indexOf(Math.max(...cv));
    const prevYearSame = range !== "ALL" && range === thisYear
      ? cm.map(m => M.per(`${Number(range) - 1}${m.slice(4)}`).made).reduce((a, b) => a + b, 0) : 0;
    const kfmt = v => v >= 1000 ? "$" + (v / 1000).toFixed(1).replace(/\.0$/, "") + "K" : money(v);
    const isNow = sel === ym(t);

    // per client, for the selected month and all time
    const keys = [...new Set([...D.clients.map(c => c.key), ...M.inv.map(i => i.client)])];
    const clientRows = keys.map(k => {
      const c = D.clients.find(x => x.key === k) || { key: k, name: M.name(k), status: "past", role: "", rate: "" };
      const ci = M.inv.filter(i => i.client === k), ct = M.todo.filter(w => w.client === k);
      const sum = (arr, m) => arr.filter(x => !m || (x.sale ? ym(x.sale) : x.month) === m).reduce((s, x) => s + x.amount, 0);
      const last = [...ci.map(i => i.sale), ...D.work.filter(w => w.client === k).map(w => w.date)].sort().pop();
      return { c, month: sum(ci, sel) + sum(ct, sel), all: sum(ci) + sum(ct), owed: ci.reduce((s, i) => s + i.open, 0) + sum(ct), last };
    }).filter(r => r.all > 0 || r.c.status !== "past").sort((a, b) => b.month - a.month || b.all - a.all);

    const V = D.vincere;
    const log = D.work.filter(w => w.month === sel).sort((a, b) => b.date.localeCompare(a.date));
    const short = txt => txt.split(/[,:(;]/)[0].trim();
    const mon = m => monthName(m).split(" ")[0];

    $("#app").innerHTML = `
      <div class="top">
        <h1>HQ</h1>
        <div class="monthnav">
          <button id="prev" class="ul" ${sel <= M.all[0] ? "disabled" : ""} aria-label="Previous month">←</button>
          <span class="num">${monthName(sel)}</span>
          <button id="next" class="ul" ${sel >= M.all[M.all.length - 1] ? "disabled" : ""} aria-label="Next month">→</button>
        </div>
      </div>
      <p class="mute small" style="margin-top:4px">UPDATED ${dShort(D.updated.slice(0, 10))} ${esc(D.updated.slice(11))}${D.offline ? " · NO IFIRMA DATA" : ""}</p>

      <div class="stats">
        <div class="stat"><div class="mute">MADE</div>
          <div class="v num">${money(cur.made)}</div>
          <div class="s mute">${delta === null ? "&nbsp;" : (delta >= 0 ? "+" : "") + delta + "% VS " + mon(addMonth(sel, -1))}</div></div>
        <div class="stat"><div class="mute">PAID</div><div class="v num">${money(cur.paid)}</div>
          <div class="s mute">${cur.made ? Math.round(cur.paid / cur.made * 100) + "% OF " + mon(sel) : "&nbsp;"}</div></div>
        <div class="stat"><div class="mute">WAITING</div><div class="v num ${owedSum ? "due" : ""}">${money(owedSum)}</div>
          <div class="s mute">${owed.length} UNPAID INVOICE${owed.length === 1 ? "" : "S"}</div></div>
        <div class="stat"><div class="mute">TO INVOICE</div><div class="v num ${toInvSum ? "warn" : ""}">${money(toInvSum)}</div>
          <div class="s mute">${invGroups.length} INVOICE${invGroups.length === 1 ? "" : "S"} TO SEND</div></div>
      </div>

      <h2>BY MONTH:</h2>
      <div class="chartbar">
        <div class="seg-ctl">${[...yearsAll, "ALL"].map(y => `<button class="rng ${y === range ? "on" : ""}" data-r="${y}">${y}</button>`).join("")}</div>
        <div class="seg-ctl">${[["bars", "BARS"], ["line", "LINE"]].map(([v, l]) => `<button class="vw ${v === view ? "on" : ""}" data-v="${v}">${l}</button>`).join("")}</div>
      </div>
      ${view === "bars" ? `
      <div class="bars">${cm.map(m => { const p = M.per(m), h = v => (v / maxBar * 100) + "%";
        return `<div class="bar ${m === sel ? "sel" : ""}" data-m="${m}" title="${monthName(m)}: ${money(p.made)}">
          <span class="t">${p.made ? kfmt(p.made) : ""}</span>
          <span class="seg todo" style="height:${h(p.notInv)}"></span>
          <span class="seg unpaid" style="height:${h(p.unpaid)}"></span>
          <span class="seg paid" style="height:${h(p.paid)}"></span></div>`; }).join("")}</div>` : (() => {
        const n = cm.length, X = i => (i + 0.5) * 100, Y = v => 200 - v / maxBar * 170;
        const pts = cv.map((v, i) => [X(i), Y(v)]);
        const live = range === thisYear || (range === "ALL" && cm[n - 1] === ym(t));
        const solid = live && n > 1 ? pts.slice(0, -1) : pts, tail = live && n > 1 ? pts.slice(-2) : [];
        const d = a => a.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
        const area = d(pts) + ` L${X(n - 1)} 200 L${X(0)} 200 Z`;
        const si = cm.indexOf(sel);
        return `<div class="linechart">
          <svg viewBox="0 0 ${n * 100} 200" preserveAspectRatio="none" aria-hidden="true">
            <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--fg)" stop-opacity=".14"/><stop offset="1" stop-color="var(--fg)" stop-opacity="0"/></linearGradient></defs>
            <path d="${area}" fill="url(#g)"/>
            <path d="${d(solid)}" fill="none" stroke="var(--fg)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
            ${tail.length ? `<path d="${d(tail)}" fill="none" stroke="var(--fg)" stroke-width="2" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>` : ""}
          </svg>
          <span class="vline" ${si < 0 ? "hidden" : ""}></span><span class="dot" ${si < 0 ? "hidden" : ""}></span><span class="tip" ${si < 0 ? "hidden" : ""}></span>
          <div class="hit">${cm.map(m => `<span class="bar" data-m="${m}" title="${monthName(m)}: ${money(M.per(m).made)}"></span>`).join("")}</div>
        </div>`; })()}
      <div class="barlabels ${cm.length > 12 ? "dense" : ""}">${cm.map((m, i) => `<span class="${m === sel ? "sel" : ""}"><span class="lg">${mon(m)}</span><span class="sm">${mon(m)[0]}</span>${range === "ALL" && (i === 0 || m.endsWith("-01")) ? `<span class="yr">${m.slice(2, 4)}</span>` : ""}</span>`).join("")}</div>
      ${view === "bars" ? `<div class="legend">
        <span><i style="background:var(--bar)"></i>PAID</span>
        <span><i style="background:var(--bar2)"></i>UNPAID</span>
        <span><i style="background:repeating-linear-gradient(135deg,var(--bar2) 0 2px,transparent 2px 5px);border:1px solid var(--bar2)"></i>TO INVOICE</span>
      </div>` : ""}
      <p class="small" style="margin-top:12px">${range === "ALL"
        ? `${yearsAll.map(y => `<span class="mute">${y}${y === thisYear ? " YTD" : ""}</span> <b class="num">${money(M.all.filter(m => m.startsWith(y)).reduce((a, m) => a + M.per(m).made, 0))}</b>`).join(` <span class="mute">·</span> `)} <span class="mute">· ALL</span> <b class="num">${money(rTotal)}</b> <span class="mute">· AVG</span> <b class="num">${money(rTotal / rMonths)}</b><span class="mute">/MO</span>`
        : `<span class="mute">${range}${range === thisYear ? " YTD" : ""}</span> <b class="num">${money(rTotal)}</b> <span class="mute">· AVG</span> <b class="num">${money(rTotal / rMonths)}</b><span class="mute">/MO</span>${prevYearSame ? ` <span class="mute">· VS ${Number(range) - 1} SAME PERIOD</span> <b class="num">${rTotal >= prevYearSame ? "+" : ""}${Math.round((rTotal - prevYearSame) / prevYearSame * 100)}%</b>` : ""}`}</p>

      <h2>NEEDS ACTION:</h2>
      <ul class="rows two">
        ${invGroups.map(g => `<li>
          <span>${esc(M.name(g.client))}<span class="sub"><span class="warn">SEND INVOICE</span> · ${mon(g.month)} · ${g.items.length > 1 ? g.items.length + " ITEMS" : esc(short(g.items[0].item))}</span></span>
          <span class="r num">${money(g.total)}</span></li>`).join("")}
        ${owed.map(i => { const late = i.due && i.due < t, dd = i.due ? days(t, i.due) : null;
          return `<li>
          <span>${esc(M.name(i.client))}
            <span class="sub"><span class="${late ? "warn" : "due"}">INVOICE SENT · ${late ? "OVERDUE" : "UNPAID"}</span> · ${late ? (-dd) + " DAYS LATE" : dd === 0 ? "DUE TODAY" : "DUE IN " + dd + " DAY" + (dd === 1 ? "" : "S")}</span></span>
          <span class="r num">${money(i.open)}</span></li>`; }).join("")}
        ${!invGroups.length && !owed.length ? `<li><span class="ok">ALL CLEAR</span><span></span></li>` : ""}
      </ul>

      <h2>CLIENTS:</h2>
      <table>
        <thead><tr><th>CLIENT</th><th class="hide-sm">DEAL</th><th class="n">${mon(sel)}</th><th class="n">ALL TIME</th></tr></thead>
        <tbody>${clientRows.filter(r => !r.c.hide).map(r => `<tr>
          <td><b>${esc(r.c.name)}</b>${r.c.status !== "active" ? `<span class="tag mute">${esc(r.c.status)}</span>` : ""}</td>
          <td class="hide-sm mute small">${esc(r.c.rate) || "—"}</td>
          <td class="n num">${r.month ? money(r.month) : "<span class='mute'>—</span>"}</td>
          <td class="n num">${money(r.all)}</td></tr>`).join("")}</tbody>
      </table>

      <div class="cols">
        <div>
          ${V ? `<h2>VINCERE RETAINER:</h2>
          <div class="meter" style="--n:${V.included}">${Array.from({ length: V.included }, (_, i) => `<span class="${i < V.used ? "on" : ""}"></span>`).join("")}</div>
          <p class="num"><b>${V.used}/${V.included}</b> USED <span class="mute">· ${V.open.length} IN WORK · ${Math.max(0, days(t, V.end))} DAYS LEFT</span></p>` : ""}
        </div>
        <div>
          <h2>PIPELINE:</h2>
          <ul class="rows two">${D.pipeline.map(p => `<li>
            <span><b>${esc(p.client)}</b><span class="sub">${esc(p.stage)}</span></span>
            <span class="r num">${p.value ? money(p.value) + (p.per ? "/" + esc(p.per).slice(0, 2).toUpperCase() : "") : ""}</span></li>`).join("")}</ul>
        </div>
      </div>

      <details>
        <summary><h2>DELIVERED IN ${mon(sel)} (${log.length})</h2></summary>
        <ul class="rows two">${log.length ? log.map(w => `<li>
          <span>${esc(short(w.item))}<span class="sub">${esc(M.name(w.client))} · ${dShort(w.date)}</span></span>
          <span class="r num ${w.amount ? "" : "mute"}">${w.amount ? money(w.amount) : "INCL."}</span></li>`).join("")
          : `<li><span class="mute">NOTHING LOGGED</span><span></span></li>`}</ul>
      </details>

      <details>
        <summary><h2>ALL INVOICES (${M.inv.length})</h2></summary>
        <ul class="rows two">${M.inv.map(i => `<li>
          <span>${esc(M.name(i.client))}<span class="sub">${dShort(i.sale)} ${i.sale.slice(0, 4)} · ${esc(i.no)}</span></span>
          <span class="r num">${money(i.amount)}<span class="sub ${i.open ? "due" : "ok"}">${i.open ? "UNPAID" : "PAID"}</span></span></li>`).join("")}</ul>
      </details>
    `;
    const follow = () => { if (range !== "ALL") range = sel.slice(0, 4); };
    $("#prev").onclick = () => { sel = addMonth(sel, -1); follow(); render(); };
    $("#next").onclick = () => { sel = addMonth(sel, 1); follow(); render(); };
    document.querySelectorAll(".rng").forEach(b => b.onclick = () => {
      range = b.dataset.r;
      if (range !== "ALL" && sel.slice(0, 4) !== range) sel = range === thisYear ? ym(t) : `${range}-12`;
      render(); });
    // line chart: drag (mouse or finger) to scrub months like a trading chart; the page follows when you let go
    const lc = document.querySelector(".linechart");
    if (lc) {
      const n = cm.length;
      const place = i => {
        const x = (i + 0.5) / n * 100 + "%", b = cv[i] / maxBar * 85;
        const tip = lc.querySelector(".tip");
        lc.querySelector(".vline").style.left = x;
        Object.assign(lc.querySelector(".dot").style, { left: x, bottom: b + "%" });
        Object.assign(tip.style, { left: x, bottom: `calc(${b}% + 12px)`, transform: i === 0 ? "none" : i === n - 1 ? "translateX(-100%)" : "translateX(-50%)" });
        tip.textContent = monthName(cm[i]).split(" ")[0] + " " + money(cv[i]);
        lc.querySelectorAll(".vline,.dot,.tip").forEach(e => e.hidden = false);
        document.querySelectorAll(".barlabels > span").forEach((e, j) => e.classList.toggle("sel", j === i));
      };
      const idx = e => { const r = lc.getBoundingClientRect(); return Math.max(0, Math.min(n - 1, Math.floor((e.clientX - r.left) / r.width * n))); };
      let cur = cm.indexOf(sel), dragging = false;
      if (cur >= 0) place(cur);
      lc.addEventListener("pointerdown", e => { dragging = true; lc.setPointerCapture(e.pointerId); cur = idx(e); place(cur); });
      lc.addEventListener("pointermove", e => { if (!dragging) return; const i = idx(e); if (i !== cur) { cur = i; place(i); } });
      const end = () => { if (!dragging) return; dragging = false; if (cm[cur] !== sel) { sel = cm[cur]; render(); } };
      lc.addEventListener("pointerup", end); lc.addEventListener("pointercancel", end);
      lc.querySelectorAll(".hit .bar").forEach(b => b.onclick = null);
    }
    document.querySelectorAll(".vw").forEach(b => b.onclick = () => { view = b.dataset.v; savePref(); render(); });
    document.querySelectorAll(".bar").forEach(b => b.onclick = () => { sel = b.dataset.m; render(); });
  }

  (async () => {
    try {
      const r = await fetch("data.enc.json?t=" + Date.now(), { cache: "no-store" });
      blob = await r.json();
    } catch { $("#err").textContent = "NO DATA."; return; }
    const data = await tryStored();
    if (data) start(data);
  })();
})();
</script>
</body>
</html>
